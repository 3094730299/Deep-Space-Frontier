// ============================================================
//  深空铸造体 Deep Space Deployer —— 构建脚本
//  用的是 ModDevGradle（NeoForge 官方推荐的现代插件）
//  你不需要看懂全部，改版本号请去 gradle.properties
// ============================================================
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ------------------------------------------------------------
//  仓库：国内镜像放最前面（官方 maven.neoforged.net 在国内连不通）
// ------------------------------------------------------------
repositories {
    // ★ NeoForge 官方 CDN 镜像：完整同步 maven.neoforged.net（国内直连可用）
    maven { name = 'NeoForged-CDN'; url = 'https://neoforged.forgecdn.net/releases/' }
    maven { name = 'NeoForged-CDN-MojangMeta'; url = 'https://neoforged.forgecdn.net/mojang-meta/' }
    // 备用镜像（BMCLAPI，只缓存热门构件，放第二位兜底）
    maven { name = 'BMCLAPI-NeoForge-Mirror'; url = 'https://bmclapi2.bangbang93.com/maven' }
    maven { name = 'CreateMod'; url = 'https://maven.createmod.net' }
    maven { name = 'RyanHCode (Sable/Aeronautics)'; url = 'https://maven.ryanhcode.dev/releases' }
    maven { name = 'ithundxr (Registrate)'; url = 'https://maven.ithundxr.dev/snapshots' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

// ------------------------------------------------------------
//  ⚠️ 国内网络修正（重要，别删）
//  ModDevGradle 会自动添加 maven.neoforged.net 的两个仓库，而且排在前面；
//  这个域名在国内被 DNS 污染（解析到 Facebook 的 IP），每次访问都要等到超时。
//  下面把所有指向它的仓库"改写"成国内可达的地址：
//    maven.neoforged.net/releases     → neoforged.forgecdn.net/releases（官方 CDN 镜像）
//    maven.neoforged.net/mojang-meta  → neoforged.forgecdn.net/mojang-meta（同一个镜像）
//  用 configureEach 是懒加载写法，所以插件后面加的仓库也会被改到。
// ------------------------------------------------------------
repositories.withType(MavenArtifactRepository).configureEach { repo ->
    def repoUrl = repo.url.toString()
    if (repoUrl.contains('maven.neoforged.net/mojang-meta')) {
        repo.setUrl('https://neoforged.forgecdn.net/mojang-meta/')
    } else if (repoUrl.contains('maven.neoforged.net')) {
        repo.setUrl('https://neoforged.forgecdn.net/releases/')
    }
}

neoForge {
    // NeoForge 版本在 gradle.properties 里改
    version = project.neo_version

    // 访问转换器：把 Slot.x / Slot.y 的 final 去掉 ——
    // 主题用 data-slot 标记位置，加载后必须能把原版物品格搬过去（否则永远错位）。
    // 文件：src/main/resources/META-INF/accesstransformer.cfg
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    runs {
        client {
            client()
            // 中文字体/调试：需要的话可以在这里加 JVM 参数
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// ------------------------------------------------------------
//  依赖
//  说明：一期（M1）刻意不依赖任何其它模组，纯 NeoForge 就能编译，
//       这样只要 NeoForge 能下载成功，模组就一定能编译出来。
//       与航空学/控制学的联动通过「方块 id 字符串 + 反射」实现，
//       等一期跑通后再决定要不要加编译期依赖。
// ------------------------------------------------------------
dependencies {
    // GeckoLib：通用终端的模型与动画（几何/动画都用官方导出器的产物）。
    // 运行期由整合包提供，所以是 compileOnly。
    compileOnly files("libs/geckolib-neoforge-1.21.1-4.9.3.jar")
    // compileOnly("com.simibubi.create:create-1.21.1:6.0.10-280:slim") { transitive = false }
    // compileOnly("dev.ryanhcode.sable:sable-neoforge-1.21.1:2.0.6")

}

// ------------------------------------------------------------
//  把 gradle.properties 里的值填进 neoforge.mods.toml
// ------------------------------------------------------------
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

// 中文注释不会影响编译；编译时如果看到乱码警告可以忽略
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ------------------------------------------------------------
//  ★ 铁律（2026-10-18 老板定）：每次更新后，构建一份 jar 放到【项目根目录】
//  ------------------------------------------------------------
//  为什么：老板要装机/发给别人时，不用再去 build/libs 里翻；
//  为什么做成任务而不是靠人记：靠记性一定会忘 —— 挂在 build 后面自动跑。
//
//  产物：<项目根>/deepspacedeployer-<版本>+mc1.21.1.jar（和 build/libs 里同一个文件）
//  ⚠️ 根目录的 jar 不入库（.gitignore 里有 /*.jar），它只是"随手可取"的副本。
tasks.register('copyJarToRoot') {
    group = 'build'
    description = '把构建好的模组 jar 复制到项目根目录（老板定的铁律）'
    dependsOn tasks.named('jar')
    // ⚠️ 不用 Copy 任务：项目根目录里有 .git 等 Gradle 追踪不了的内容，
    //    它会在"目标目录状态不可读"上直接失败（真踩过）。直接 Files.copy 最省事。
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        // 先清掉旧版本的，避免根目录堆一堆、拿错版本
        fileTree(projectDir) { include('deepspacedeployer-*.jar') }.files.each { it.delete() }
        java.nio.file.Files.copy(jarFile.toPath(),
                new File(projectDir, jarFile.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("[深空铸造体] ★ 铁律：已把 jar 复制到项目根目录 → ${jarFile.name}")
    }
}

// build 跑完自动复制（铁律）；单独跑 `gradlew copyJarToRoot` 也行
tasks.named('build') {
    finalizedBy tasks.named('copyJarToRoot')
}

// ------------------------------------------------------------
//  界面主题（内置 WebView）的离线校验
//  ------------------------------------------------------------
//  主题是"玩家会自己改的 HTML"，改错了的症状通常是"某行跑到框外"或"某个界面打不开"。
//  这两个任务不用开游戏就能查出来（用的是游戏的字宽度量 + 和游戏内同一段布局/绘制代码）：
//
//    gradlew checkThemes    → 每个界面加载一遍，报告元素数/规则数/内容高度/动作/占位
//    gradlew renderThemes   → 每个界面渲染成 PNG，出到 build/theme-preview/
//
//  ⚠️ 必须先 compileJava（下面靠 classpath 依赖保证顺序）。
// ------------------------------------------------------------
def themeTaskGroup = 'deep space deployer'
def themeDir = 'src/main/resources/assets/deepspacedeployer/theme/default'
// 主题目录 + 中文参数：显式给 JVM 指定 UTF-8，避免 Windows 默认编码把中文搞乱
def themeJvmArgs = ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8']

// 想校验/出图另一套主题（比如自己写的，或者仓库里的例子）：
//   gradlew checkThemes -Ptheme=C:/.../theme/custom/我的主题
def chosenThemeDir = { -> (project.findProperty('theme') ?: themeDir).toString() }

tasks.register('checkThemes', JavaExec) {
    group = themeTaskGroup
    description = '校验主题里每个界面（HTML 解析 / 数据绑定 / 布局），不开游戏'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.deepspacedeployer.tools.ThemePreview'
    workingDir = projectDir
    jvmArgs = themeJvmArgs
    doFirst { args = ['--check', chosenThemeDir()] }
}

tasks.register('renderThemes', JavaExec) {
    group = themeTaskGroup
    description = '把每个界面渲染成 PNG（build/theme-preview/），改主题不用开游戏'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.deepspacedeployer.tools.ThemePreview'
    workingDir = projectDir
    jvmArgs = themeJvmArgs
    doFirst { args = ['--render', chosenThemeDir(), 'build/theme-preview'] }
}

// 布局分解：排查"某个界面内容高得离谱"时用
//   gradlew dumpTheme -Pfile=buyer.html
tasks.register('dumpTheme', JavaExec) {
    group = themeTaskGroup
    description = '打印某个界面每个元素的 y/高度（-Pfile=buyer.html），排查排版溢出'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.deepspacedeployer.tools.ThemePreview'
    workingDir = projectDir
    jvmArgs = themeJvmArgs
    doFirst {
        args = ['--dump', chosenThemeDir(), project.findProperty('file') ?: 'buyer.html']
    }
}

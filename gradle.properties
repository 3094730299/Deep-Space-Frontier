# ============================================================
#  深空铸造体 Deep Space Deployer —— 构建配置（可以改数字，别改格式）
# ============================================================

# --- Gradle 自身 ---
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# --- Minecraft / NeoForge ---
# 你的整合包用的是 NeoForge 21.1.248（1.21.1），这里保持一致
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.248
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# --- 模组本体信息 ---
mod_id=deepspacedeployer
mod_name=Deep Space Deployer
mod_name_cn=深空铸造体
mod_version=0.1.11
mod_group_id=com.deepspacedeployer
mod_authors=DSD Team
mod_license=All Rights Reserved
mod_description=Six interstellar companies build factories across the world. Trade, print blueprints, weld physics structures.

# --- 国内网络修正：Minecraft 版本清单改走官方源（默认走被墙的 maven.neoforged.net）---
neoForge.neoFormRuntime.launcherManifestUrl=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

# --- 可选联动模组（只影响编译时是否能直接 import，运行时会做兼容判断）---
# 这些 jar 从你的整合包 mods 文件夹里复制到 libs/ 文件夹后即可编译联动代码
create_version=6.0.10
aeronautics_version=1.3.2
sable_version=2.0.6

# 这里指向整合包里现成的那份 jar（想换版本就改这个路径）。
# 注意：gradle.properties 在 Java 里是按 ISO-8859-1 读的，中文路径必须写成 \uXXXX 转义，
# 否则路径会变成乱码、文件不存在。下面这行的 \u 就是孢子危机四个字。


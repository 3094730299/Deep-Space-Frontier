<!DOCTYPE html>
<!--
  收购投送机 —— buyer.html
  ================================================================
  数据键：{{公司}} {{账户}} {{余额}} {{卡余额}} {{等级}} {{声望}}
          data-if="在线" / data-if="!在线" / data-if="被挡" / data-if="自动收购"
  列表：  收购价[]（{{名称}} {{单价}}）
  动作：  toggle_autosell / sell_now / open_transfer
  原生占位：data-slot="card"（银行卡槽）data-slot="input9"（3×3 投料格）
            data-slot="player"（玩家背包，固定在最底部）

  ⚠️ 版面预算：画布 288×270，玩家背包占最下面 76px（y=186 起）——
     所以上面所有内容必须塞进 186px。塞不下时打
     gradlew checkThemes 会报"溢出"，并给出实际内容高度。
-->
<html>
<head>
  <title>收购投送机</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <!-- data-viewport = 这个界面"真正能用的高度"：y=216 以下是原版画的玩家背包，主题不占。
       声明之后，文字截断和 overflow 滚动都按 216 算（见 LayoutEngine.layout）。 -->
  <div class="win" data-viewport="216">

    <div class="bar">
      <div class="title">{{公司}}</div>
      <div class="chip" data-if="在线">已开机</div>
      <div class="chip off" data-if="!在线">未插卡</div>
      <div class="chip off" data-if="被挡">挡</div>
    </div>

    <div class="warn" data-if="被挡">⚠ 上方被整格方块挡住，这台机器不工作</div>

    <div class="info">
      <div class="col">
        <div class="v gold">账户 {{账户}} · {{余额}}</div>
      </div>
      <div class="col">
        <div class="v accent">{{等级}} · 声望 {{声望}} · 卡上 {{卡余额}}</div>
      </div>
    </div>

    <!-- 槽位行只放槽位（左边卡槽 + 3×3 投料格），按钮另起一行 —— 
         挤在同一行会把按钮推到界面外（真发生过） -->
    <div class="slotgrid">
      <div data-slot="card" class="slot"></div>
      <div data-slot="input9" class="slots9" style="left:22"></div>
      <div class="hint">卡槽 · 3×3 投料格</div>
    </div>

    <div class="btns">
      <div class="btn" data-action="toggle_autosell">自动：{{自动收购}}</div>
      <div class="btn" data-action="sell_now">立即收购</div>
      <div class="btn ghost" data-action="open_transfer">资金转化</div>
    </div>

    <div class="list short">
      <div class="row" data-repeat="收购价">
        <div class="name">{{名称}}</div>
        <div class="price">{{单价}}</div>
      </div>
      <div class="empty" data-if="!收购价数量">这张收购清单是空的</div>
    </div>

    <div data-slot="player" class="player absolute"></div>

  </div>
</body>
</html>

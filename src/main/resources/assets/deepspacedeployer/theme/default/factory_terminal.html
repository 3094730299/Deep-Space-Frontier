<!DOCTYPE html>
<!--
  工厂终端（商店） —— factory_terminal.html
  ================================================================
  数据键：{{公司}} {{账户}} {{余额}} {{卡余额}} {{等级}} {{声望}} {{页}} {{总页}}
  列表：  商品[]（{{名称}} {{单价}} {{锁定}} {{锁定原因}}）
  动作：  buy（配 data-index → 用第几行）/ page_prev / page_next / open_transfer
  原生占位：data-slot="card" data-slot="player"

  ⚠️ 版面预算：画布 288×270，玩家背包占最下面 76px（y=186 起）。
-->
<html>
<head>
  <title>工厂终端</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="win">

    <div class="bar">
      <div class="title">{{公司}}</div>
      <div class="chip" data-if="在线">已开机</div>
      <div class="chip off" data-if="!在线">未插卡</div>
      <div class="chip">第 {{页}} / {{总页}} 页</div>
    </div>

    <div class="info">
      <div class="col">
        <div class="k">账户 / 本公司余额</div>
        <div class="v gold">{{账户}} · {{余额}}</div>
      </div>
      <div class="col">
        <div class="k">等级 · 声望 · 卡上</div>
        <div class="v accent">{{等级}} · {{声望}} · {{卡余额}}</div>
      </div>
    </div>

    <div class="slotgrid">
      <div data-slot="card" class="slot"></div>
      <div class="hint" style="left:24;top:4;width:240">银行卡槽 · 点上面的页码按钮翻页</div>
    </div>

    <div class="btns">
      <div class="btn ghost" data-action="page_prev">上一页</div>
      <div class="btn ghost" data-action="page_next">下一页</div>
      <div class="btn ghost" data-action="open_transfer">资金转化</div>
    </div>

    <div class="list mid">
      <div class="row" data-repeat="商品">
        <div class="name">{{名称}}<span class="tag" data-if="锁定">（{{锁定原因}}）</span></div>
        <div class="price">{{单价}}</div>
        <div class="btn" data-action="buy" data-index="{{行号}}">买</div>
      </div>
      <div class="empty" data-if="!商品数量">这家公司暂时没有可买的商品</div>
    </div>

    <div data-slot="player" class="player absolute"></div>

  </div>
</body>
</html>

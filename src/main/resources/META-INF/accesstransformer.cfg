# ============================================================
#  AccessTransformer（NeoForge 官方放行清单）
# ============================================================
# 为什么需要它：
#   主题用 data-slot="input9" 这样的标记指定"原版物品格摆哪儿"，
#   而原版 net.minecraft.world.inventory.Slot 的 x / y 是 final，
#   不改 final 就没法在主题加载后把槽位搬过去 ——
#   结果就是"主题画自己的框、物品格停在硬编码坐标"，两边错位。
#
# 语法：public-f = 改成 public 并去掉 final
# 影响范围：只把这两个字段变成可写，其它行为不变（NeoForge 允许模组这么做）。
# ============================================================
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y
